[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "imessage-analysis"
version = "0.1.0"
description = "Read your local iMessage history (imessage) and build a wiki over it (atlas)."
requires-python = ">=3.9"
dependencies = []                          # imessage is stdlib-only

[project.optional-dependencies]
atlas = ["openai>=1.0", "python-dotenv"]   # the wiki pipeline (model seam)

[project.scripts]
imsg = "imessage.__main__:main"

[tool.setuptools]
packages = ["imessage", "atlas", "atlas.llm"]

[tool.setuptools.package-data]
atlas = ["prompts/*.md"]
